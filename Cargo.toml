[package]
name = "bytebeat"
version = "0.1.0"
edition = "2024"
description = "A standalone native bytebeat composer"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.15.3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rquickjs = "0.14"
rtrb = "0.3"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
