[package]
name = "bytebeat"
version = "1.2.1"
edition = "2024"
description = "A standalone native bytebeat composer"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.15.3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rquickjs = "0.14"
rtrb = "0.3"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "7"
flate2 = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
resvg = { version = "0.45", default-features = false }
rosc = "0.11"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.15.3", features = ["jack"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
