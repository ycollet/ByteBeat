name: Release installers

on:
  workflow_dispatch:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      debian_version: ${{ steps.version.outputs.debian_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate installer version
        id: version
        run: python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
      - name: Check release metadata tests
        run: python3 -m unittest discover -s scripts -p test_release_metadata.py

  debian:
    needs: metadata
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      DEBIAN_VERSION: ${{ needs.metadata.outputs.debian_version }}
      BINARY_PATH: target/x86_64-unknown-linux-gnu/release/bytebeat
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config dpkg-dev desktop-file-utils \
            libasound2-dev libjack-jackd2-dev libudev-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Build Debian installer
        run: bash scripts/package-linux.sh deb
      - name: Verify installation
        run: |
          apt-get install -y ./dist/*.deb
          bytebeat --version
          printf 't\n' > /tmp/bytebeat-smoke.js
          bytebeat --check --file /tmp/bytebeat-smoke.js --seconds 0.01
      - uses: actions/upload-artifact@v4
        with:
          name: installer-debian-x86_64
          path: dist/*.deb
          if-no-files-found: error

  fedora:
    needs: metadata
    runs-on: ubuntu-24.04
    container: fedora:43
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      RPM_RELEASE: ${{ needs.metadata.outputs.rpm_release }}
      BINARY_PATH: target/x86_64-unknown-linux-gnu/release/bytebeat
    steps:
      - name: Install build and packaging dependencies
        run: |
          dnf install -y \
            ca-certificates curl-minimal git gcc gcc-c++ make pkgconf-pkg-config \
            rpm-build desktop-file-utils alsa-lib-devel jack-audio-connection-kit-devel \
            systemd-devel libX11-devel libXi-devel libXrandr-devel libXcursor-devel \
            libxkbcommon-devel wayland-devel mesa-libGL-devel
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test --locked --target x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Build Fedora installer
        run: bash scripts/package-linux.sh rpm
      - name: Verify installation
        run: |
          dnf install -y ./dist/*.rpm
          bytebeat --version
          printf 't\n' > /tmp/bytebeat-smoke.js
          bytebeat --check --file /tmp/bytebeat-smoke.js --seconds 0.01
      - uses: actions/upload-artifact@v4
        with:
          name: installer-fedora-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  macos:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test and build
        run: |
          # Hosted macOS runners lack the accelerated OpenGL context this test requires.
          cargo test --locked --target "$TARGET" -- \
            --skip shader_art::tests::native::all_presets_compile_and_render_with_native_opengl_and_layer_compositing
          cargo build --release --locked --target "$TARGET"
      - name: Build and verify disk image
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.target }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: metadata
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BASE_VERSION: ${{ needs.metadata.outputs.base_version }}
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$env:VERSION" "/DFileVersion=$env:BASE_VERSION" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Verify installation
        shell: pwsh
        run: |
          $installer = Get-Item "dist\*.exe"
          $destination = Join-Path $env:RUNNER_TEMP "bytebeat-installed"
          $process = Start-Process $installer.FullName -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$destination`""
          )
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          & "$destination\bytebeat.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed executable failed" }
          $song = Join-Path $env:RUNNER_TEMP "bytebeat-smoke.js"
          Set-Content -Path $song -Value "t" -Encoding ascii
          & "$destination\bytebeat.exe" --check --file $song --seconds 0.01
          if ($LASTEXITCODE -ne 0) { throw "Installed audio engine check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x86_64
          path: dist/*.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [metadata, debian, fedora, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.metadata.outputs.version }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Publish installers and checksums
        working-directory: dist
        run: |
          sha256sum -- *.deb *.rpm *.dmg *.exe > SHA256SUMS
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Bytebeat $VERSION" --generate-notes --draft
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            -- *.deb *.rpm *.dmg *.exe SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE"
